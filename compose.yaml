services:
  web:
    container_name: community-exchange-web
    build: .
    command: sh -lc "npm ci && (npm exec vite -- --host 0.0.0.0 --port 3036 &) && bundle exec rails s -b '0.0.0.0'"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_NAME: community_exchange_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    volumes:
      - .:/community-exchange
      - web_node_modules:/community-exchange/node_modules
    ports:
      - "3000:3000"
      - "3036:3036"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:17-alpine
    container_name: community-exchange-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_exchange_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_exchange_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: {}
  web_node_modules: {}
